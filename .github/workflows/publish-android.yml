name: Publish Android Public

on:
  push:
    tags:
      - "v*"
      - "Android-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate tag and set app version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" == Android-v* ]]; then
            version="${tag#Android-v}"
          else
            version="${tag#v}"
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview)?$ ]] || {
            echo "Expected vX.Y.Z[-preview] or Android-vX.Y.Z[-preview]" >&2
            exit 1
          }
          numeric_version="${version%-preview}"
          IFS=. read -r major minor patch <<< "$numeric_version"
          (( major <= 1000 && minor <= 999 && patch <= 999 )) || {
            echo "Version components exceed Android versionCode range" >&2
            exit 1
          }
          code=$(((major * 1000000 + minor * 1000 + patch) * 2))
          if [[ "$version" == *-preview ]]; then
            code=$((code - 1))
          fi
          (( code > 0 )) || { echo "Version code must be positive" >&2; exit 1; }
          echo "APP_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]] || {
            echo "Android release signing secrets are missing" >&2
            exit 1
          }
          key_file="$RUNNER_TEMP/pico-manager-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "ANDROID_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify and prepare release assets
        shell: bash
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            apk="android/app/build/outputs/apk/release/app-${abi}-release.apk"
            test -s "$apk"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
            badging="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | head -1)"
            [[ "$badging" == *"versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'"* ]]
            native_abis="$(unzip -Z1 "$apk" | awk -F/ '/^lib\// { print $2 }' | sort -u | paste -sd, -)"
            if [[ "$abi" == universal ]]; then
              [[ "$native_abis" == arm64-v8a,armeabi-v7a,x86_64 ]]
            else
              [[ "$native_abis" == "$abi" ]]
            fi
            cp "$apk" "dist/PicoManager-${GITHUB_REF_NAME}-${abi}.apk"
          done
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ endsWith(github.ref_name, '-preview') }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
