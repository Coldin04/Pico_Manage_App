name: Publish Android Public

on:
  push:
    tags:
      - "v*"
      - "Android-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SDK dependency source
        id: sdk-version
        shell: bash
        run: |
          sdk_version="$(sed -n 's/^picobookSdkVersion=//p' android/gradle.properties | tail -n 1)"
          [[ -n "$sdk_version" ]] || { echo "picobookSdkVersion is missing from android/gradle.properties" >&2; exit 1; }
          if [[ "$sdk_version" =~ ^git\.([0-9a-f]{40})$ ]]; then
            echo "source=git" >> "$GITHUB_OUTPUT"
            echo "commit=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$sdk_version" == git.* ]]; then
            echo "Git SDK versions must use git.<full 40-character lowercase commit SHA>." >&2
            exit 1
          elif [[ "$sdk_version" == local ]]; then
            echo "The local SDK version is for a developer's mavenLocal and cannot be used by GitHub release builds." >&2
            exit 1
          elif [[ "$sdk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "source=maven" >> "$GITHUB_OUTPUT"
            echo "commit=" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported PicoBook SDK version: $sdk_version" >&2
            exit 1
          fi
          echo "version=$sdk_version" >> "$GITHUB_OUTPUT"
          echo "Using PicoBook SDK $sdk_version"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Rust for SDK source build
        if: steps.sdk-version.outputs.source == 'git'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache source-built SDK Maven artifact
        if: steps.sdk-version.outputs.source == 'git'
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/cold04/picobookmgr/${{ steps.sdk-version.outputs.version }}
          key: picobook-sdk-aar-v1-ndk27.2-uniffi0.32.2-${{ steps.sdk-version.outputs.commit }}

      - name: Install Android NDK for SDK source build
        if: steps.sdk-version.outputs.source == 'git' && steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust Android tools
        if: steps.sdk-version.outputs.source == 'git' && steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-ndk --locked
          cargo install uniffi --version 0.32.2 --features cli --bin uniffi-bindgen --locked

      - name: Build and install SDK source into Maven local
        if: steps.sdk-version.outputs.source == 'git' && steps.sdk-cache.outputs.cache-hit != 'true'
        env:
          PICOBOOK_SDK_REPOSITORY: ${{ vars.PICOBOOK_SDK_REPOSITORY || 'https://github.com/Coldin04/PicoBook_SDK.git' }}
        run: ./scripts/install-sdk-from-git.sh "${{ steps.sdk-version.outputs.version }}"

      - name: Validate tag and set app version
        id: app-version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" == Android-v* ]]; then
            version="${tag#Android-v}"
          else
            version="${tag#v}"
          fi
          release_tag="$tag"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview([1-9][0-9]*)?)?$ ]] || {
            echo "Expected vX.Y.Z[-previewN] or Android-vX.Y.Z[-previewN]" >&2
            exit 1
          }
          numeric_version="${version%%-preview*}"
          preview_number=0
          if [[ "$version" == *-preview* ]]; then
            preview_number="${version##*-preview}"
            [[ -n "$preview_number" ]] || preview_number=1
            (( preview_number <= 98 )) || {
              echo "Preview number must be between 1 and 98" >&2
              exit 1
            }
          fi
          IFS=. read -r major minor patch <<< "$numeric_version"
          (( major <= 20 && minor <= 999 && patch <= 999 )) || {
            echo "Version components exceed Android versionCode range" >&2
            exit 1
          }
          base_code=$((major * 1000000 + minor * 1000 + patch))
          if (( preview_number > 0 )); then
            code=$((base_code * 100 + preview_number))
          else
            code=$((base_code * 100 + 99))
          fi
          (( code > 0 )) || { echo "Version code must be positive" >&2; exit 1; }
          echo "APP_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if (( preview_number > 0 )); then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]] || {
            echo "Android release signing secrets are missing" >&2
            exit 1
          }
          key_file="$RUNNER_TEMP/pico-manager-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          echo "ANDROID_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify and prepare release assets
        shell: bash
        env:
          SDK_VERSION: ${{ steps.sdk-version.outputs.version }}
          SDK_SOURCE: ${{ steps.sdk-version.outputs.source }}
          SDK_COMMIT: ${{ steps.sdk-version.outputs.commit }}
          PICOBOOK_SDK_REPOSITORY: ${{ vars.PICOBOOK_SDK_REPOSITORY || 'https://github.com/Coldin04/PicoBook_SDK.git' }}
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            apk="android/app/build/outputs/apk/release/app-${abi}-release.apk"
            test -s "$apk"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
            badging="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | head -1)"
            [[ "$badging" == *"versionCode='$APP_VERSION_CODE' versionName='$APP_VERSION_NAME'"* ]]
            native_abis="$(unzip -Z1 "$apk" | awk -F/ '/^lib\// { print $2 }' | sort -u | paste -sd, -)"
            if [[ "$abi" == universal ]]; then
              [[ "$native_abis" == arm64-v8a,armeabi-v7a,x86_64 ]]
            else
              [[ "$native_abis" == "$abi" ]]
            fi
            cp "$apk" "dist/PicoManager-${APP_VERSION_NAME}-${abi}.apk"
          done
          {
            echo "App release tag: $RELEASE_TAG"
            echo "App commit: $(git rev-parse HEAD)"
            echo "SDK coordinate: com.cold04:picobookmgr:$SDK_VERSION"
            if [[ "$SDK_SOURCE" == git ]]; then
              echo "SDK repository: ${PICOBOOK_SDK_REPOSITORY:-https://github.com/Coldin04/PicoBook_SDK.git}"
              echo "SDK commit: $SDK_COMMIT"
            else
              echo "SDK source: Maven Central"
            fi
          } > dist/BUILD-INFO.txt
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.app-version.outputs.prerelease }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
